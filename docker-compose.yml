services:
  parking-capture-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking_capture_service
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file:
      - .env
    volumes:
      - ./snapshots:/app/snapshots
      - ./models:/models
    # To enable GPU acceleration on systems with NVIDIA Container Toolkit, uncomment below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - delivery-network

networks:
  delivery-network:
    external: true
